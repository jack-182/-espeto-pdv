# Netlify configuration for Espeto PDV Frontend

[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"

# Redirect all dynamic routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API proxying to backend
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Environment variables (substitua com seus valores no painel Netlify)
[context.production.environment]
  REACT_APP_API_URL = "https://espeto-api.netlify.app"
  REACT_APP_ENV = "production"

[context.staging.environment]
  REACT_APP_API_URL = "https://espeto-staging.netlify.app"
  REACT_APP_ENV = "staging"

[context.development.environment]
  REACT_APP_API_URL = "http://localhost:3000"
  REACT_APP_ENV = "development"
